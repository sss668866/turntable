<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小决定转盘</title>
  <style>
    :root { color-scheme: light; --ink:#1f2933; --muted:#66717d; --paper:#f5f7f8; --line:#d8dee3; --teal:#087e8b; --teal-dark:#056571; --coral:#dc5f56; --yellow:#f5be3d; --blue:#579ad6; --violet:#9a76c8; --green:#69a777; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    .app { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:28px 0 42px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:25px; border-bottom:1px solid var(--line); }
    h1 { font-size:28px; margin:0 0 7px; font-weight:700; letter-spacing:0; }
    .sub { margin:0; color:var(--muted); font-size:15px; }
    .shortcut { color:var(--muted); font-size:13px; border:1px solid var(--line); padding:8px 11px; white-space:nowrap; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:40px; align-items:center; padding-top:34px; }
    .wheel-area { min-width:0; display:flex; flex-direction:column; align-items:center; }
    .wheel-wrap { width:min(100%,590px); aspect-ratio:1; position:relative; }
    canvas { display:block; width:100%; height:100%; filter:drop-shadow(0 10px 16px rgba(30,41,51,.14)); cursor:pointer; }
    .pointer { position:absolute; z-index:2; top:-1px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent; border-top:38px solid var(--ink); filter:drop-shadow(0 2px 1px rgba(0,0,0,.16)); pointer-events:none; }
    .center-dot { position:absolute; left:50%; top:50%; width:52px; height:52px; border:5px solid #fff; border-radius:50%; background:var(--ink); transform:translate(-50%,-50%); pointer-events:none; }
    .result { min-height:48px; margin:22px 0 15px; text-align:center; color:var(--muted); font-size:16px; }
    .result strong { color:var(--ink); font-size:20px; font-weight:700; }
    .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    button { min-height:42px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:0 17px; cursor:pointer; border-radius:5px; font-weight:600; }
    button:hover:not(:disabled) { border-color:#a7b3bb; background:#fbfcfc; }
    button:focus-visible,input:focus-visible { outline:3px solid rgba(8,126,139,.32); outline-offset:2px; }
    button.primary { border-color:var(--teal); background:var(--teal); color:#fff; min-width:108px; }
    button.primary:hover:not(:disabled) { background:var(--teal-dark); }
    button.stop { border-color:var(--coral); color:#b5473f; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .panel { align-self:stretch; padding-left:30px; border-left:1px solid var(--line); }
    .section-title { margin:0 0 15px; font-size:17px; font-weight:700; }
    .count-row { display:grid; grid-template-columns:1fr auto; gap:9px; margin-bottom:12px; }
    input[type="number"], .item-input { width:100%; min-height:42px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--ink); padding:0 11px; }
    .help { color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.5; }
    .items { display:grid; gap:8px; max-height:390px; overflow:auto; padding:2px 4px 2px 0; }
    .item { display:grid; grid-template-columns:31px 1fr; align-items:center; gap:8px; }
    .swatch { width:22px; height:22px; border-radius:50%; border:1px solid rgba(31,41,51,.13); }
    .status { margin:14px 0 0; color:var(--muted); font-size:13px; }
    @media (max-width:820px) { main { grid-template-columns:1fr; gap:28px; } .panel { padding:28px 0 0; border-left:0; border-top:1px solid var(--line); } .items { max-height:260px; } }
    @media (max-width:520px) { .app { width:min(100% - 24px,1120px); padding-top:20px; } header { padding-bottom:19px; } h1 { font-size:24px; } .shortcut { display:none; } main { padding-top:24px; } .pointer { border-left-width:14px; border-right-width:14px; border-top-width:31px; } .center-dot { width:43px; height:43px; border-width:4px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>小决定转盘</h1><p class="sub">设定选项，点击转盘或开始按钮，让它替你做决定。</p></div>
      <div class="shortcut">空格键：开始 / 停止</div>
    </header>
    <main>
      <section class="wheel-area" aria-label="随机转盘">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="760" height="760" aria-label="点击开始旋转转盘"></canvas>
          <div class="center-dot" aria-hidden="true"></div>
        </div>
        <p class="result" id="result" aria-live="polite">准备好了，选择一个选项试试。</p>
        <div class="controls">
          <button class="primary" id="startButton" type="button">开始旋转</button>
          <button class="stop" id="stopButton" type="button" disabled>停止</button>
        </div>
      </section>
      <aside class="panel">
        <h2 class="section-title">转盘设置</h2>
        <div class="count-row">
          <input id="countInput" type="number" min="2" max="24" value="6" aria-label="等分数量">
          <button id="applyCount" type="button">确认</button>
        </div>
        <p class="help">输入 2 到 24 的数字，转盘会平均分成对应份数。下面填写每一份显示的文字。</p>
        <div id="items" class="items" aria-label="转盘选项"></div>
        <p class="status" id="status">6 个选项</p>
      </aside>
    </main>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const countInput = document.getElementById('countInput');
      const applyCount = document.getElementById('applyCount');
      const itemsEl = document.getElementById('items');
      const status = document.getElementById('status');
      const startButton = document.getElementById('startButton');
      const stopButton = document.getElementById('stopButton');
      const result = document.getElementById('result');
      const colors = ['#087e8b','#f5be3d','#dc5f56','#579ad6','#9a76c8','#69a777','#e5864c','#4c9b9b'];
      let options = ['旅行','电影','奶茶','读书','运动','休息'];
      let rotation = 0;
      let spinning = false;
      let animationId = null;
      let lastFrame = 0;
      let selectedIndex = 0;

      function normalizeAngle(angle) { return ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2); }
      function drawWheel() {
        const size = canvas.width;
        const center = size / 2;
        const radius = center - 17;
        const slice = Math.PI * 2 / options.length;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(rotation);
        options.forEach((label, index) => {
          const start = -Math.PI / 2 + index * slice;
          const end = start + slice;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = colors[index % colors.length];
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.save();
          ctx.rotate(start + slice / 2);
          ctx.translate(radius * 0.64, 0);
          ctx.rotate(Math.PI / 2);
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const maxChars = options.length > 12 ? 5 : 8;
          const text = label.length > maxChars ? label.slice(0, maxChars) + '…' : label;
          ctx.font = `600 ${options.length > 12 ? 25 : 30}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.fillText(text || String(index + 1), 0, 0, radius * 0.72);
          ctx.restore();
        });
        ctx.restore();
        ctx.beginPath();
        ctx.arc(center, center, radius, 2 * Math.PI, false);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 7;
        ctx.stroke();
      }

      function renderInputs() {
        itemsEl.replaceChildren();
        options.forEach((value, index) => {
          const row = document.createElement('label');
          row.className = 'item';
          const swatch = document.createElement('span');
          swatch.className = 'swatch';
          swatch.style.background = colors[index % colors.length];
          swatch.setAttribute('aria-hidden', 'true');
          const input = document.createElement('input');
          input.className = 'item-input';
          input.value = value;
          input.maxLength = 30;
          input.placeholder = `选项 ${index + 1}`;
          input.setAttribute('aria-label', `选项 ${index + 1}`);
          input.addEventListener('input', () => { options[index] = input.value.trim(); drawWheel(); });
          row.append(swatch, input);
          itemsEl.append(row);
        });
        status.textContent = `${options.length} 个选项`;
      }

      function setCount() {
        if (spinning) return;
        const count = Math.max(2, Math.min(24, Number.parseInt(countInput.value, 10) || 2));
        countInput.value = count;
        options = Array.from({ length: count }, (_, index) => options[index] || `选项 ${index + 1}`);
        result.textContent = '选项已更新，可以开始旋转。';
        renderInputs(); drawWheel();
      }

      function finishSpin() {
        spinning = false; animationId = null;
        startButton.disabled = false; stopButton.disabled = true; countInput.disabled = false; applyCount.disabled = false;
        result.innerHTML = `抽中：<strong>${options[selectedIndex] || `选项 ${selectedIndex + 1}`}</strong>`;
      }

      function animate(now) {
        const elapsed = Math.min(now - lastFrame, 40);
        lastFrame = now;
        rotation += elapsed * 0.0225;
        drawWheel();
        if (spinning) animationId = requestAnimationFrame(animate);
      }

      function startSpin() {
        if (spinning || options.length < 2) return;
        lastFrame = performance.now(); spinning = true;
        startButton.disabled = true; stopButton.disabled = false; countInput.disabled = true; applyCount.disabled = true;
        result.textContent = '转盘正在旋转…';
        animationId = requestAnimationFrame(animate);
      }

      function stopSpin() {
        if (!spinning) return;
        if (animationId) cancelAnimationFrame(animationId);
        const slice = Math.PI * 2 / options.length;
        const angleAtPointer = normalizeAngle(-Math.PI / 2 - rotation);
        selectedIndex = Math.floor(normalizeAngle(angleAtPointer + Math.PI / 2) / slice) % options.length;
        finishSpin(); drawWheel();
      }

      applyCount.addEventListener('click', setCount);
      countInput.addEventListener('keydown', event => { if (event.key === 'Enter') setCount(); });
      startButton.addEventListener('click', startSpin);
      stopButton.addEventListener('click', stopSpin);
      canvas.addEventListener('click', startSpin);
      window.addEventListener('keydown', event => {
        if (event.code === 'Space' && document.activeElement.tagName !== 'INPUT') { event.preventDefault(); spinning ? stopSpin() : startSpin(); }
      });
      renderInputs(); drawWheel();
    })();
  </script>
</body>
</html>
